name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/AsuX.apk

      - name: Verify APK exists
        run: test -s build/AsuX.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsuX-Android-APK
          path: build/AsuX.apk
          if-no-files-found: error
