name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install required packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot 4.7.2 and export templates
        run: |
          GODOT_VERSION="4.7.2"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$RUNNER_TEMP/godot" "$TEMPLATE_DIR"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -a "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_DIR/"
          godot --version

      - name: Configure Android paths for Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/AsuX.apk

      - name: Verify APK exists
        run: test -s build/AsuX.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsuX-Android-APK
          path: build/AsuX.apk
          if-no-files-found: error
